# Refreshes data/airports.json from the OurAirports nightly CSV.
#
# Commits only when the airport set actually changed. The ingest script
# preserves the previous `generatedAt` when the data is identical, so an
# unchanged day produces a byte-identical file and `git diff --quiet` passes —
# which is what keeps this from opening a commit every morning forever.
#
# A commit here triggers a Vercel deploy, so the artifact reaches production
# without anyone doing anything.
name: Refresh airports

on:
  schedule:
    # 08:23 UTC — after OurAirports' nightly rebuild, off the top of the hour
    # where GitHub's scheduler is most congested, and deliberately OUT of the
    # 04:00-05:00 UTC band where most "nightly" crons cluster. That band is
    # where this job's delay went 40 minutes -> 11 hours -> a wholly unserved
    # window across 2026-08-23..28. The quieter-hour part is a heuristic, not
    # something measured; what IS measured is that 04:10 stopped being served.
    # It also puts the run in the maintainer's afternoon (16:23 SGT), which
    # matters more than it looks: both refresh jobs are designed to fail closed
    # and let a HUMAN adjudicate from the Actions tab, and a run that lands
    # while they are awake is a run whose failure gets seen.
    - cron: "23 8 * * *"
  workflow_dispatch:

# Least privilege: the job writes one data file and nothing else.
permissions:
  contents: write

concurrency:
  # SHARED with refresh-cities.yml, deliberately. Both jobs commit to main on
  # a cron half an hour apart, and GitHub routinely delays scheduled runs well
  # past that under load. A group name unique per workflow would let them
  # overlap and turn one of the two pushes into a non-fast-forward; the same
  # name serialises them.
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ingest airports
        run: node scripts/ingest-airports.mjs

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/airports.json; then
            echo "No change in the airport set — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airports.json data/airports-report.md
          git commit -m "chore: refresh airports from OurAirports"
          git push
