# The repo's test suite, run on every push and pull request.
#
# Until this existed, every invariant test in the repo was advisory: the only
# workflow was refresh-airports.yml, which runs an ingest and commits, and
# nothing anywhere ran `npm test`. The daily airport refresh could commit a
# reshaped artifact and the globe build could commit an asset missing 61
# countries, and in both cases the tests written to catch exactly that would
# sit on disk unexecuted.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # legacy-peer-deps: .npmrc sets it, and `npm ci` honours it. Kept
      # explicit here so a future .npmrc change surfaces as a CI failure
      # rather than a mystery resolution difference against local installs.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The `server-only` guard on lib/server/airports.ts, cityIndex.ts and
      # catalog.ts fires only in a production build: it is what turns a client
      # import of a multi-megabyte artifact into a build error instead of a
      # silent shipment. Nothing else in CI runs `next build` — `tsc` and
      # vitest cannot see the boundary, and the e2e job runs `next dev` — so
      # without this step the guard's only trigger would be Vercel's preview
      # check, which is not required. Verified negatively on 2026-09-06: a
      # client import of lib/server/catalog fails this command with the full
      # import trace. Measured at 8-19 s locally.
      - run: npx next build

  # A separate job from `test`, deliberately: a browser download and a Next
  # build are minutes of work that the unit gate should not wait behind, and a
  # flaky browser must not be able to redden the suite that has never been
  # flaky on CI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The npm cache does not cover ~/.cache/ms-playwright, so without this
      # every run re-downloads the browser. Keyed on the resolved Playwright
      # version rather than on the lockfile hash, because that is what decides
      # which browser build is wanted.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` pulls the system libraries the browser needs on
      # ubuntu-latest. Still run on a cache hit, because the cache restores the
      # browser binaries and not the apt packages beside them.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          # Not a secret. It signs sessions in a throwaway SQLite file that
          # exists for the length of one job, and the same value is committed
          # in playwright.config.ts. It has to be >= 24 chars and must not be
          # one of the placeholders lib/authSecret.ts rejects.
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
