# Refreshes the worldwide city catalog from GeoNames' cities500 dump, and the
# per-country facts artifact from Wikidata.
#
# THREE JOBS, and the split is load-bearing rather than tidiness. `cities`
# (GeoNames ingest + Wikidata enrichment) and `facts` (Wikidata country facts)
# run in PARALLEL on separate runners; `commit` waits for both, verifies, and
# makes the single commit.
#
# They were one job until 2026-08-28, and that is what broke: `enrich-cities
# .mjs` spends ~30 UNBROKEN MINUTES on WDQS, and `ingest-country-facts.mjs`
# started the instant it finished, on the same runner and so the same IP, with
# the rate budget already spent. WDQS answered 429 `Retry-After: 120` in 0.13s.
# Twice in one day: once costing only `drivingSide` (a property demotes and
# carries forward), once costing the ENTIRE run, because that 429 landed on the
# `codes` (P297) query — the one query whose failure is fatal, since without it
# there is no country universe to build against. Wikidata was healthy both
# times; a probe answered in 0.47s minutes later. The second workload was
# simply paying for the first's budget.
#
# Separate runners mean separate IPs and separate budgets. PARALLEL rather than
# chained deliberately: chaining `facts` behind `cities` would preserve the
# exact temporal adjacency that caused this, just on a different runner, and
# would buy nothing — `facts` is ~90s against `cities`' ~30 minutes, so the
# wall-clock difference either way is noise. Politeness is not reduced by the
# parallelism: each script still issues its requests SERIALLY at ~1/s, and WDQS
# rate-limits per client IP, so two runners are two ordinary clients rather than
# one impolite one. The aggregate added here is ~40 requests over ~90s.
#
# `scripts/ingest-country-facts.mjs` ALSO now waits up to 300s when WDQS asks
# (`MAX_RETRY_AFTER_MS`), which is the belt to this braces: the split stops the
# budget being spent, the ceiling stops a routine pause being fatal.
#
# Commits only when the catalog actually changed. `scripts/ingest-cities.mjs`
# preserves the previous `generatedAt` on every artifact whose payload is
# unchanged — each of the 246 shards via `shardPayload`, and public/cities/
# index.json, data/cities-index.json and data/cities-enrich-targets.json via
# `stampedPayload` — so a quiet day produces a byte-identical tree. That is
# what keeps this from committing 246 shards and a 3.7 MB index every night,
# and it is verified by Task 6 Step 6 rather than assumed here.
# `scripts/ingest-country-facts.mjs` uses the same `stampedPayload` idiom for
# data/country-facts.json, verified byte-identical across five consecutive
# live runs on a quiet day — that is what the change test below depends on.
#
# A commit here triggers a Vercel deploy, so the artifacts reach production
# without anyone doing anything. That is also why every ingest step below
# aborts BEFORE writing when its own sanity check fails: nothing looks at this
# run. ingest-country-facts.mjs's `assertFactsSane` carries 34 throw sites and
# sits above `mkdirSync`, same shape as the other two scripts.
#
# ...and it is why `commit` runs the test suite ITSELF, in "Verify the
# artifacts" below, before it is allowed to commit. GitHub does not create
# workflow runs from pushes authenticated with the default GITHUB_TOKEN
# (recursion prevention; only workflow_dispatch and repository_dispatch are
# exempt), and actions/checkout persists exactly that token for the `git push`
# at the end — so **ci.yml never runs on this workflow's commit**, while
# Vercel's git integration deploys it regardless. Without the verify step, the
# very scenario cited below to justify `git status --porcelain` — a country
# GeoNames newly covers, which `assertSane` accepts anywhere in 244..248 —
# would sail past the gate, land on main against the exact
# `toHaveLength(246)` in lib/cityShard.test.ts, deploy to production, and
# never produce a red test anywhere. The same holds for the other exact pins a
# refresh can legitimately move: the 750-per-country cap, and the five named
# destinations asserted by geonameid.
#
# So: if the artifacts would fail the repo's own tests, this workflow goes red
# and commits nothing. A human sees a failed scheduled run in the Actions tab
# and decides whether a 247th country is real — which is the right place for
# that call to be made, rather than in a production incident. The gate is
# strict across the split: `commit` needs BOTH ingests, so a failed `facts`
# still withholds the `cities` work. That is deliberate — the two artifacts are
# verified together by one `npm test`, and committing half of a verified pair
# is not something this file is willing to do silently.
#
# GeoNames is CC BY 4.0 — attribution required. The credit lives in
# components/plan/GeoNamesCredit.tsx, not here. Wikidata (country facts) is
# CC0 — no attribution condition — so it adds nothing there; see
# data/country-facts-report.md's own Attribution section for the record.
name: Refresh cities

on:
  schedule:
    # 08:53 UTC — after GeoNames' nightly rebuild, and half an hour after
    # refresh-airports. The offset is politeness, not a guarantee: GitHub
    # routinely delays scheduled runs well past 30 minutes under load. The
    # shared concurrency group below is what actually keeps the two jobs from
    # overlapping.
    # Moved off 04:40 together with refresh-airports — see that file's schedule
    # comment for the delays that prompted it. This workflow never ran on 04:40
    # at all: it was registered 2026-08-27T18:29Z and its single window,
    # 2026-08-28 04:40Z, went unserved, as did refresh-airports' the same
    # night. Nothing about the workflow itself was at fault.
    - cron: "53 8 * * *"
  workflow_dispatch:

# Least privilege, and now genuinely least: the two ingest jobs only read the
# repo. Only `commit` is granted write, so a bug in an ingest job cannot push.
permissions:
  contents: read

concurrency:
  # SHARED with refresh-airports.yml, deliberately. Both workflows commit to
  # main, and this one holds the repo's longest checkout->push window, so an
  # overlapping refresh-airports push would make our `git push` a
  # non-fast-forward. A group name unique per workflow would not serialise
  # them; the same name does. Workflow-level, so it still covers all three jobs
  # as one unit after the split.
  group: refresh-data
  cancel-in-progress: false

jobs:
  cities:
    name: Ingest and enrich cities
    runs-on: ubuntu-latest
    # The default is 360. Nothing bounds the worst case below it: a degraded
    # Wikidata day is ~42 SPARQL batches x 3 attempts x 90s SPARQL_TIMEOUT_MS
    # (~3.1h) plus ~313 extract batches x 3 x 30s REST_TIMEOUT_MS (~7.8h), so
    # a bad night would burn hours of runner minutes before the 6h kill. A
    # healthy run is far inside 60 minutes; anything past it is a fast red.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24 for stable TypeScript type stripping: ingest-cities.mjs imports
          # lib/*.ts leaves directly rather than keeping a copy that could
          # drift. enrich-cities.mjs is node:fs|path|url only and doesn't need
          # it for that reason, but runs under the same setup-node step.
          node-version: 24
      # No `npm ci` here any more, and no `cache: npm`: both ingest scripts run
      # on Node built-ins alone, so this job needs no node_modules and now
      # starts ingesting immediately. That does drop the old fail-fast on a
      # broken lockfile — accepted, because ci.yml runs `npm ci` on every push
      # to every branch, so a lockfile that cannot install is already red
      # before it can reach a nightly run. `commit` still installs, for vitest.

      - name: Ingest cities
        run: node scripts/ingest-cities.mjs

      # A single failed SPARQL batch costs nothing: those ids are left out of
      # this run's scope, so they keep the enrichment they already had. What
      # DOES abort the run is `assertEnrichmentSane` — a run that would erase
      # more than half the previous coverage. That failure fails this job and
      # so skips `commit`, which is the intent: a bad Wikidata day costs one
      # skipped refresh, not the catalog's whole descriptive layer. Reads
      # data/cities-enrich-targets.json, which the step above just wrote.
      - name: Enrich the top cities per country
        run: node scripts/enrich-cities.mjs

      # `if-no-files-found: error` because an empty artifact here would be the
      # worst outcome available: `commit` would overlay nothing, see a clean
      # tree, report "nothing to commit" and go GREEN on a run that produced
      # no data. Loud beats plausible.
      #
      # These paths span public/ and data/, so the artifact's root is the
      # workspace root and `download-artifact` restores them in place with
      # `path: .`. The `facts` artifact below does NOT have that property —
      # see the note there.
      - uses: actions/upload-artifact@v7
        with:
          name: city-artifacts
          path: |
            public/cities
            data/cities-index.json
            data/cities-enrich-targets.json
            data/cities-report.md
          if-no-files-found: error
          retention-days: 1

  facts:
    name: Ingest country facts
    runs-on: ubuntu-latest
    # A healthy run is ~90s. With MAX_RETRY_AFTER_MS at 300s and two retries a
    # single query can now park 10 minutes, so a pathological day could run
    # long; 30 minutes is the fast red for it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:fs|path|url only, but pinned to the same 24 the other jobs use
          # rather than inheriting whatever the runner image ships.
          node-version: 24

      # A third, independent source (Wikidata), still covered by "Verify the
      # artifacts" in `commit` rather than sailing past it. `assertFactsSane`
      # runs before any write, same as the two ingests above — see the header.
      - name: Ingest country facts
        run: node scripts/ingest-country-facts.mjs

      # BOTH paths are under data/, so the artifact's root is data/ — NOT the
      # workspace root the way city-artifacts' is. That is why `commit`
      # downloads this one with `path: data`. Get it wrong and the files land
      # at the repo root, the real ones are never overlaid, the change test
      # sees the untouched checkout and the run goes GREEN having committed
      # nothing — so `commit` asserts the placement rather than trusting it.
      - uses: actions/upload-artifact@v7
        with:
          name: facts-artifacts
          path: |
            data/country-facts.json
            data/country-facts-report.md
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Verify and commit
    needs: [cities, facts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that writes. Everything above runs read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # This install is for vitest, so "Verify the artifacts" below can run.
      # legacy-peer-deps: .npmrc sets it and `npm ci` honours it, kept explicit
      # for the reason ci.yml gives.
      - run: npm ci --legacy-peer-deps

      - uses: actions/download-artifact@v8
        with:
          name: city-artifacts
          path: .

      - uses: actions/download-artifact@v8
        with:
          name: facts-artifacts
          # data/, not `.` — see the upload note in the `facts` job.
          path: data

      - name: Check the ingest artifacts landed where the commit step looks
        run: |
          # Guards the one mistake that would be SILENT: an artifact whose root
          # was computed differently than assumed lands beside the tree instead
          # of on it, leaving the checked-out files in place. Every later step
          # then behaves perfectly on stale data. A stray at the repo root is
          # the exact fingerprint of that, so look for it directly.
          for stray in country-facts.json country-facts-report.md cities-index.json cities-enrich-targets.json cities-report.md; do
            if [ -e "$stray" ]; then
              echo "::error::$stray landed at the repo root — the artifact root moved; fix the download path"
              exit 1
            fi
          done
          for f in public/cities/index.json data/cities-index.json data/cities-enrich-targets.json \
                   data/cities-report.md data/country-facts.json data/country-facts-report.md; do
            [ -s "$f" ] || { echo "::error::missing or empty after download: $f"; exit 1; }
          done
          echo "Artifacts in place:"
          git status --porcelain -- public/cities data/ | head -20

      # The whole suite, not a hand-picked subset: lib/cityShard.test.ts,
      # lib/server/cityIndex.test.ts and lib/countryFacts.test.ts are the
      # files that read these artifacts off disk today, but naming them here
      # would be a list that silently stops being complete the day someone
      # adds a fourth. `npm test` is also literally ci.yml's gate, which is
      # the point — see the header. `npx tsc --noEmit`, ci.yml's other half,
      # is deliberately not repeated: these scripts write JSON only, so every
      # TypeScript file in the tree is byte-identical to the commit CI
      # already type-checked.
      - name: Verify the artifacts against the repo's own tests
        run: npm test

      - name: Commit if the catalog or facts changed
        run: |
          # `git status --porcelain`, not `git diff --quiet`: `git diff` is
          # blind to untracked files, and `assertSane` explicitly accepts a
          # country GeoNames newly covers — whose shard arrives untracked.
          # data/country-facts.json is the same shape of risk: a country
          # Wikidata newly answers for arrives untracked too. refresh-airports
          # .yml can use `git diff` only because it watches one always-tracked
          # file.
          #
          # This short-circuit is only reachable because every artifact under
          # these paths is byte-stable on a quiet day (see the header). If this
          # job commits every night, that is what broke — check Task 6 Step 6
          # for the city artifacts, or re-run ingest-country-facts.mjs twice in
          # a row and diff for the facts artifact.
          CHANGED="$(git status --porcelain -- public/cities data/cities-index.json data/cities-enrich-targets.json data/country-facts.json)"
          if [ -z "$CHANGED" ]; then
            echo "No change in the city catalog or country facts — nothing to commit."
            exit 0
          fi
          echo "$CHANGED" | head -20
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/cities-report.md and data/country-facts-report.md are staged
          # but deliberately NOT part of the change test above: both are prose
          # about the data, not something the app reads, so each rides along
          # with a real change instead of being able to cause one.
          git add public/cities data/cities-index.json data/cities-enrich-targets.json data/cities-report.md data/country-facts.json data/country-facts-report.md
          git commit -m "chore: refresh cities and country facts"
          # The concurrency group keeps the other refresh job out of this
          # window, but a human push to main can still land inside it and make
          # this a non-fast-forward. Rebase the one data commit onto their tip
          # and retry, rather than losing the day's refresh to a race with no
          # retry. Verified to work on the shallow checkout actions/checkout
          # produces. (If their push changed source, the rebased tree is not
          # quite the one tested a minute ago — but that tree is what ci.yml
          # runs on THEIR commit, so it is covered where this job is not.)
          git push || { git pull --rebase origin main && git push; }
